name: Build Memory Trail DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-trail-dmg.yml"
      - "Memory Trail.xcodeproj/**"
      - "MemoryTrail/**"
      - "Branding/**"
      - "Scripts/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: write
  statuses: write

concurrency:
  group: memory-trail-release-v2
  cancel-in-progress: true

env:
  # Release sequence: 1.1.0 Build 1 -> 1.1.1 Build 2 -> 1.1.2 Build 3 -> ...
  RELEASE_VERSION: "1.1.4"
  RELEASE_BUILD: "5"

jobs:
  build-dmg:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply Memory Trail safeguards
        run: bash "$PWD/Scripts/rebrand_memory_trail.sh"

      - name: Generate verified macOS icon assets
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift "$PWD/Scripts/generate_memory_trail_icons.swift" "$PWD"

          MASTER="$PWD/Branding/MemoryTrailIconMaster.png"
          ICONSET="$PWD/MemoryTrail/Resources/Assets.xcassets/AppIcon.appiconset"
          ONBOARDING="$PWD/MemoryTrail/Resources/Assets.xcassets/OnboardingIcon.imageset"

          test -s "$MASTER"
          test -s "$ICONSET/icon_16x16.png"
          test -s "$ICONSET/icon_512x512@2x.png"
          test -s "$ONBOARDING/OnboardingIcon.png"
          test -s "$ONBOARDING/OnboardingIcon@2x.png"

          MASTER_WIDTH="$(sips -g pixelWidth "$MASTER" | awk '/pixelWidth/ {print $2}')"
          MASTER_HEIGHT="$(sips -g pixelHeight "$MASTER" | awk '/pixelHeight/ {print $2}')"
          test "$MASTER_WIDTH" = "$MASTER_HEIGHT"
          test "$MASTER_WIDTH" -ge 1024
          test "$(sips -g pixelWidth "$ICONSET/icon_16x16.png" | awk '/pixelWidth/ {print $2}')" = "16"
          test "$(sips -g pixelWidth "$ICONSET/icon_512x512@2x.png" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelWidth "$ONBOARDING/OnboardingIcon.png" | awk '/pixelWidth/ {print $2}')" = "512"
          test "$(sips -g pixelWidth "$ONBOARDING/OnboardingIcon@2x.png" | awk '/pixelWidth/ {print $2}')" = "1024"

          echo "Verified clean 16px through 1024px Memory Trail icon assets."

      - name: Refresh embedded website icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          master = Path("Branding/MemoryTrailIconMaster.png")
          website = Path("docs/index.html")
          if master.exists() and website.exists():
              encoded = base64.b64encode(master.read_bytes()).decode("ascii")
              html = website.read_text(encoding="utf-8")
              html = re.sub(
                  r"data:image/png;base64,[A-Za-z0-9+/=]+",
                  f"data:image/png;base64,{encoded}",
                  html,
              )
              website.write_text(html, encoding="utf-8")
          PY

      - name: Publish corrected source and icon assets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "macOS source and icon assets are already current."
          else
            git commit -m "Regenerate clean macOS icon assets"
            git push origin HEAD:main
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Memory Trail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project "Memory Trail.xcodeproj" \
            -scheme "Memory Trail" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$PWD/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            ERROR_LINE="$(grep -m1 -E 'error:' "$PWD/xcodebuild.log" | sed 's/^[[:space:]]*//' | cut -c1-135 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Xcode build failed; inspect the workflow run."
            fi
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=memory-trail-build-diagnostics \
              -f description="$ERROR_LINE" >/dev/null
            exit "$BUILD_STATUS"
          fi

          APP="$PWD/build/Build/Products/Release/Memory Trail.app"
          test -d "$APP"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=memory-trail-build-diagnostics \
            -f description="Memory Trail $RELEASE_VERSION build $RELEASE_BUILD macOS release passed." >/dev/null

      - name: Capture screenshots from real Memory Trail windows
        id: screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trail.app"
          BIN="$APP/Contents/MacOS/Memory Trail"
          OUT="$PWD/docs/screenshots"
          FIND_WINDOW="$RUNNER_TEMP/find-memory-trail-window.swift"

          test -x "$BIN"
          mkdir -p "$OUT"
          rm -f "$OUT"/*.png

          cat > "$FIND_WINDOW" <<'SWIFT'
          import CoreGraphics
          import Foundation

          let options: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          guard let windows = CGWindowListCopyWindowInfo(options, kCGNullWindowID) as? [[String: Any]] else {
              exit(2)
          }

          for window in windows {
              let owner = window[kCGWindowOwnerName as String] as? String ?? ""
              let layer = window[kCGWindowLayer as String] as? Int ?? -1
              let bounds = window[kCGWindowBounds as String] as? [String: Any] ?? [:]
              let width = bounds["Width"] as? Double ?? 0
              let height = bounds["Height"] as? Double ?? 0

              if owner == "Memory Trail", layer == 0, width > 900, height > 600,
                 let number = window[kCGWindowNumber as String] as? Int {
                  print(number)
                  exit(0)
              }
          }
          exit(1)
          SWIFT

          capture_screen() {
            SCREEN="$1"
            FILE="$2"
            LOG="$RUNNER_TEMP/memory-trail-$SCREEN.log"
            "$BIN" "--screenshot-demo=$SCREEN" >"$LOG" 2>&1 &
            APP_PID=$!

            WINDOW_ID=""
            for ATTEMPT in $(seq 1 30); do
              WINDOW_ID="$(xcrun swift "$FIND_WINDOW" 2>/dev/null || true)"
              if [ -n "$WINDOW_ID" ]; then break; fi
              sleep 0.25
            done

            if [ -z "$WINDOW_ID" ]; then
              cat "$LOG" || true
              kill "$APP_PID" 2>/dev/null || true
              exit 1
            fi

            sleep 1.5
            screencapture -x -l "$WINDOW_ID" "$OUT/$FILE"
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            test -s "$OUT/$FILE"
          }

          capture_screen timeline today-ui.png
          capture_screen insights insights-ui.png
          capture_screen ask ask-memory-trail-ui.png
          capture_screen clipboard clipboard-history-ui.png
          capture_screen favorites favorites-ui.png
          capture_screen settings settings-ui.png

      - name: Sign Memory Trail
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trail.app"

          if [ -n "${MACOS_CERTIFICATE_P12:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/memorytrail-cert.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/memorytrail-signing.keychain-db"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
            test -n "$IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trail.app"
          DMG="$PWD/MemoryTrail-$RELEASE_VERSION.dmg"
          test -d "$APP"

          rm -rf "$PWD/dmg-root"
          mkdir -p "$PWD/dmg-root"
          ditto "$APP" "$PWD/dmg-root/Memory Trail.app"
          ln -s /Applications "$PWD/dmg-root/Applications"

          hdiutil create \
            -volname "Memory Trail" \
            -srcfolder "$PWD/dmg-root" \
            -ov \
            -format UDZO \
            "$DMG"

          shasum -a 256 "$DMG"

      - name: Publish single current GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          DMG="MemoryTrail-$RELEASE_VERSION.dmg"
          TITLE="Memory Trail $RELEASE_VERSION (Build $RELEASE_BUILD)"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          cat > release-notes.md <<EOF
          Memory Trail $RELEASE_VERSION for macOS.
          Build: $RELEASE_BUILD

          Highlights:
          - The up-to-date screen now uses a full illustrated Memory Trail landscape.
          - Mountains, sunrise, trees, a winding trail, laptop, and success badge make update checks feel more polished.
          - The current version and build remain visible dynamically.
          - Keep Exploring still returns you to Memory Trail immediately.


          Privacy:
          - Captured activity is sourced, processed, and stored locally on the Mac.
          - No cloud timeline sync.
          - No external data connectors.
          - No analytics or advertising SDKs.
          - No Memory Trail account or remote account is required.
          - Captured timeline data is not transmitted to an external service.
          - Passwords and Wallet are excluded by default.
          - Clipboard capture can be disabled at any time.
          - Apps and processes can be excluded from capture.
          - Source code is available in this repository for review and verification.
          - Memory Trail does not generate AI summaries of the timeline.

          Requires macOS 14 or later. Detailed window/activity capture requires Accessibility permission.

          This automated build uses ad-hoc signing when a Developer ID certificate is not configured and is not notarized in that case.
          EOF

          BODY="$(cat release-notes.md)"
          TARGET_SHA="$(git rev-parse HEAD)"

          EXISTING_CODE="$(curl -sS -o existing-release.json -w '%{http_code}' \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/tags/$TAG")"

          if [ "$EXISTING_CODE" = "200" ]; then
            RELEASE_ID="$(jq -r '.id' existing-release.json)"
            jq -n \
              --arg target "$TARGET_SHA" \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              '{target_commitish:$target, name:$title, body:$body, draft:false, prerelease:false, make_latest:"true"}' \
              > release-payload.json

            curl -fsSL -X PATCH \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "$API/releases/$RELEASE_ID" \
              --data-binary @release-payload.json \
              > published-release.json
          else
            jq -n \
              --arg tag "$TAG" \
              --arg target "$TARGET_SHA" \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              '{tag_name:$tag, target_commitish:$target, name:$title, body:$body, draft:false, prerelease:false, make_latest:"true"}' \
              > release-payload.json

            curl -fsSL -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "$API/releases" \
              --data-binary @release-payload.json \
              > published-release.json

            RELEASE_ID="$(jq -r '.id' published-release.json)"
          fi

          RELEASE_ID="${RELEASE_ID:-$(jq -r '.id' published-release.json)}"
          test -n "$RELEASE_ID"
          test "$RELEASE_ID" != "null"

          ASSET_ID="$(curl -fsSL \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/$RELEASE_ID/assets" \
            | jq -r --arg name "$DMG" '.[] | select(.name == $name) | .id' \
            | head -n 1)"

          if [ -n "$ASSET_ID" ]; then
            curl -fsSL -X DELETE \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API/releases/assets/$ASSET_ID" \
              >/dev/null
          fi

          curl -fsSL -X POST \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            -H "Content-Type: application/x-apple-diskimage" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$DMG" \
            --data-binary @"$DMG" \
            > uploaded-asset.json

          test "$(jq -r '.state' uploaded-asset.json)" = "uploaded"
          echo "Published $(jq -r '.name' uploaded-asset.json) to $TAG."

          # Keep older test releases from blocking the official release.
          curl -fsSL \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases?per_page=100" \
            > all-releases.json

          jq -r --arg tag "$TAG" '.[] | select(.tag_name != $tag) | [.id, .tag_name] | @tsv' all-releases.json \
            | while IFS=$'\t' read -r OLD_ID OLD_TAG; do
                [ -z "$OLD_ID" ] && continue
                curl -fsSL -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  "$API/releases/$OLD_ID" \
                  >/dev/null || true

                ENCODED_TAG="$(printf '%s' "$OLD_TAG" | jq -sRr @uri)"
                curl -fsSL -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  "$API/git/refs/tags/$ENCODED_TAG" \
                  >/dev/null || true
              done
      - name: Publish refreshed app screenshots
        if: github.event_name == 'push' && steps.screenshots.outcome == 'success'
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "main advanced while this build was running; skipping screenshot commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
          else
            git commit -m "Refresh Memory Trail screenshots from real app UI"
            git push origin HEAD:main
          fi

