name: Build Memory Trails DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-trail-dmg.yml"
      - "Memory Trails.xcodeproj/**"
      - "MemoryTrail/**"
      - "Branding/**"
      - "Scripts/**"
      - "README.md"
      - "docs/**"

permissions:
  contents: write
  statuses: write

concurrency:
  group: memory-trail-release-v2
  cancel-in-progress: true

env:
  # Increment RELEASE_BUILD for every app change published on the same version.
  RELEASE_VERSION: "1.5"
  RELEASE_BUILD: "1"

jobs:
  build-dmg:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove legacy pre-rename DMG asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          LEGACY_DMG="MemoryTrail-$RELEASE_VERSION.dmg"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          STATUS="$(curl -sS -o legacy-release.json -w '%{http_code}' \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/tags/$TAG")"

          if [ "$STATUS" = "200" ]; then
            RELEASE_ID="$(jq -r '.id' legacy-release.json)"
            curl -fsSL \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API/releases/$RELEASE_ID/assets" \
              | jq -r --arg name "$LEGACY_DMG" '.[] | select(.name == $name) | .id' \
              | while read -r LEGACY_ASSET_ID; do
                  [ -z "$LEGACY_ASSET_ID" ] && continue
                  curl -fsSL -X DELETE \
                    -H "$AUTH_HEADER" \
                    -H "$ACCEPT_HEADER" \
                    -H "$VERSION_HEADER" \
                    "$API/releases/assets/$LEGACY_ASSET_ID" \
                    >/dev/null
                  echo "Deleted legacy asset $LEGACY_DMG."
                done
          fi

      - name: Apply Memory Trails safeguards
        run: bash "$PWD/Scripts/rebrand_memory_trail.sh"

      - name: Generate verified macOS icon assets
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift "$PWD/Scripts/generate_memory_trail_icons.swift" "$PWD"

          MASTER="$PWD/Branding/MemoryTrailIconMaster.png"
          ICONSET="$PWD/MemoryTrail/Resources/Assets.xcassets/AppIcon.appiconset"
          ONBOARDING="$PWD/MemoryTrail/Resources/Assets.xcassets/OnboardingIcon.imageset"

          test -s "$MASTER"
          test -s "$ICONSET/icon_16x16.png"
          test -s "$ICONSET/icon_512x512@2x.png"
          test -s "$ONBOARDING/OnboardingIcon.png"
          test -s "$ONBOARDING/OnboardingIcon@2x.png"

          MASTER_WIDTH="$(sips -g pixelWidth "$MASTER" | awk '/pixelWidth/ {print $2}')"
          MASTER_HEIGHT="$(sips -g pixelHeight "$MASTER" | awk '/pixelHeight/ {print $2}')"
          test "$MASTER_WIDTH" = "$MASTER_HEIGHT"
          test "$MASTER_WIDTH" -ge 1024
          test "$(sips -g pixelWidth "$ICONSET/icon_16x16.png" | awk '/pixelWidth/ {print $2}')" = "16"
          test "$(sips -g pixelWidth "$ICONSET/icon_512x512@2x.png" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelWidth "$ONBOARDING/OnboardingIcon.png" | awk '/pixelWidth/ {print $2}')" = "512"
          test "$(sips -g pixelWidth "$ONBOARDING/OnboardingIcon@2x.png" | awk '/pixelWidth/ {print $2}')" = "1024"

          echo "Verified clean 16px through 1024px Memory Trails icon assets."

      - name: Refresh embedded website icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          master = Path("Branding/MemoryTrailIconMaster.png")
          website = Path("docs/index.html")
          if master.exists() and website.exists():
              encoded = base64.b64encode(master.read_bytes()).decode("ascii")
              html = website.read_text(encoding="utf-8")
              html = re.sub(
                  r"data:image/png;base64,[A-Za-z0-9+/=]+",
                  f"data:image/png;base64,{encoded}",
                  html,
              )
              website.write_text(html, encoding="utf-8")
          PY

      - name: Publish corrected source and icon assets
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "macOS source and icon assets are already current."
          else
            git commit -m "Regenerate clean macOS icon assets"
            git push origin HEAD:main
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Memory Trails
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project "Memory Trails.xcodeproj" \
            -scheme "Memory Trails" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$PWD/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            ERROR_LINE="$(grep -m1 -E 'error:' "$PWD/xcodebuild.log" | sed 's/^[[:space:]]*//' | cut -c1-135 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Xcode build failed; inspect the workflow run."
            fi
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=memory-trail-build-diagnostics \
              -f description="$ERROR_LINE" >/dev/null
            exit "$BUILD_STATUS"
          fi

          APP="$PWD/build/Build/Products/Release/Memory Trails.app"
          test -d "$APP"
          test -s "$APP/Contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=memory-trail-build-diagnostics \
            -f description="Memory Trails $RELEASE_VERSION build $RELEASE_BUILD macOS release passed." >/dev/null

      - name: Capture screenshots from real Memory Trails windows
        id: screenshots
        continue-on-error: true
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trails.app"
          BIN="$APP/Contents/MacOS/Memory Trails"
          OUT="$PWD/docs/screenshots"
          FIND_WINDOW="$RUNNER_TEMP/find-memory-trail-window.swift"

          test -x "$BIN"
          mkdir -p "$OUT"
          rm -f "$OUT"/*.png

          cat > "$FIND_WINDOW" <<'SWIFT'
          import CoreGraphics
          import Foundation

          let options: CGWindowListOption = [.optionOnScreenOnly, .excludeDesktopElements]
          guard let windows = CGWindowListCopyWindowInfo(options, kCGNullWindowID) as? [[String: Any]] else {
              exit(2)
          }

          for window in windows {
              let owner = window[kCGWindowOwnerName as String] as? String ?? ""
              let layer = window[kCGWindowLayer as String] as? Int ?? -1
              let bounds = window[kCGWindowBounds as String] as? [String: Any] ?? [:]
              let width = bounds["Width"] as? Double ?? 0
              let height = bounds["Height"] as? Double ?? 0

              if owner == "Memory Trails", layer == 0, width > 900, height > 600,
                 let number = window[kCGWindowNumber as String] as? Int {
                  print(number)
                  exit(0)
              }
          }
          exit(1)
          SWIFT

          capture_screen() {
            SCREEN="$1"
            FILE="$2"
            LOG="$RUNNER_TEMP/memory-trail-$SCREEN.log"
            "$BIN" "--screenshot-demo=$SCREEN" >"$LOG" 2>&1 &
            APP_PID=$!

            WINDOW_ID=""
            for ATTEMPT in $(seq 1 30); do
              WINDOW_ID="$(xcrun swift "$FIND_WINDOW" 2>/dev/null || true)"
              if [ -n "$WINDOW_ID" ]; then break; fi
              sleep 0.25
            done

            if [ -z "$WINDOW_ID" ]; then
              cat "$LOG" || true
              kill "$APP_PID" 2>/dev/null || true
              exit 1
            fi

            sleep 1.5
            screencapture -x -l "$WINDOW_ID" "$OUT/$FILE"
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
            test -s "$OUT/$FILE"
          }

          capture_screen timeline today-ui.png
          capture_screen insights insights-ui.png
          capture_screen ask ask-memory-trail-ui.png
          capture_screen clipboard clipboard-history-ui.png
          capture_screen favorites favorites-ui.png
          capture_screen settings settings-ui.png

      - name: Sign Memory Trails
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trails.app"

          if [ -n "${MACOS_CERTIFICATE_P12:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/memorytrail-cert.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/memorytrail-signing.keychain-db"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
            test -n "$IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create branded DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Trails.app"
          DMG="$PWD/MemoryTrails-$RELEASE_VERSION.dmg"
          RW_DMG="$PWD/MemoryTrails-$RELEASE_VERSION-rw.dmg"
          ROOT="$PWD/dmg-root"
          BG="$ROOT/.background/installer.png"
          MASTER="$PWD/Branding/MemoryTrailIconMaster.png"
          DRAW="$RUNNER_TEMP/draw-memory-trails-installer.swift"

          test -d "$APP"
          test -s "$MASTER"

          rm -rf "$ROOT" "$DMG" "$RW_DMG"
          mkdir -p "$ROOT/.background"
          ditto "$APP" "$ROOT/Memory Trails.app"
          ln -s /Applications "$ROOT/Applications"

          cat > "$DRAW" <<'SWIFT'
          import AppKit
          import Foundation

          guard CommandLine.arguments.count >= 3 else { exit(2) }
          let iconURL = URL(fileURLWithPath: CommandLine.arguments[1])
          let outputURL = URL(fileURLWithPath: CommandLine.arguments[2])
          guard let icon = NSImage(contentsOf: iconURL) else { exit(3) }

          let canvas = NSSize(width: 1200, height: 800)
          let image = NSImage(size: canvas)
          image.lockFocus()

          let rect = NSRect(origin: .zero, size: canvas)
          let gradient = NSGradient(colors: [
              NSColor(calibratedRed: 0.025, green: 0.075, blue: 0.25, alpha: 1),
              NSColor(calibratedRed: 0.09, green: 0.18, blue: 0.52, alpha: 1),
              NSColor(calibratedRed: 0.43, green: 0.16, blue: 0.64, alpha: 1),
              NSColor(calibratedRed: 0.98, green: 0.39, blue: 0.30, alpha: 1)
          ])!
          gradient.draw(in: rect, angle: 90)

          func mountain(_ points: [NSPoint], color: NSColor) {
              guard let first = points.first else { return }
              let p = NSBezierPath()
              p.move(to: first)
              for pt in points.dropFirst() { p.line(to: pt) }
              p.close()
              color.setFill()
              p.fill()
          }

          mountain([
              NSPoint(x: 0, y: 275), NSPoint(x: 150, y: 470), NSPoint(x: 260, y: 340),
              NSPoint(x: 390, y: 520), NSPoint(x: 535, y: 330), NSPoint(x: 690, y: 490),
              NSPoint(x: 840, y: 335), NSPoint(x: 990, y: 455), NSPoint(x: 1200, y: 290),
              NSPoint(x: 1200, y: 0), NSPoint(x: 0, y: 0)
          ], color: NSColor(calibratedRed: 0.035, green: 0.10, blue: 0.27, alpha: 0.94))

          mountain([
              NSPoint(x: 0, y: 165), NSPoint(x: 210, y: 315), NSPoint(x: 370, y: 210),
              NSPoint(x: 555, y: 350), NSPoint(x: 730, y: 205), NSPoint(x: 930, y: 325),
              NSPoint(x: 1200, y: 175), NSPoint(x: 1200, y: 0), NSPoint(x: 0, y: 0)
          ], color: NSColor(calibratedRed: 0.02, green: 0.065, blue: 0.18, alpha: 0.98))

          let trail = NSBezierPath()
          trail.move(to: NSPoint(x: 40, y: 55))
          trail.curve(to: NSPoint(x: 445, y: 135),
                      controlPoint1: NSPoint(x: 175, y: 10),
                      controlPoint2: NSPoint(x: 290, y: 180))
          trail.curve(to: NSPoint(x: 760, y: 210),
                      controlPoint1: NSPoint(x: 540, y: 105),
                      controlPoint2: NSPoint(x: 650, y: 255))
          trail.curve(to: NSPoint(x: 1180, y: 330),
                      controlPoint1: NSPoint(x: 875, y: 155),
                      controlPoint2: NSPoint(x: 1020, y: 370))
          trail.lineWidth = 12
          let shadow = NSShadow()
          shadow.shadowColor = NSColor.systemPink.withAlphaComponent(0.85)
          shadow.shadowBlurRadius = 22
          shadow.shadowOffset = .zero
          shadow.set()
          NSColor(calibratedRed: 1.0, green: 0.60, blue: 0.10, alpha: 0.95).setStroke()
          trail.stroke()
          NSGraphicsContext.current?.saveGraphicsState()
          NSShadow().set()
          trail.lineWidth = 4
          NSColor.white.withAlphaComponent(0.9).setStroke()
          trail.stroke()
          NSGraphicsContext.current?.restoreGraphicsState()

          icon.draw(in: NSRect(x: 78, y: 620, width: 128, height: 128),
                    from: .zero, operation: .sourceOver, fraction: 1)

          let titleAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 70, weight: .bold),
              .foregroundColor: NSColor.white
          ]
          ("Memory Trails" as NSString).draw(at: NSPoint(x: 232, y: 678), withAttributes: titleAttrs)

          let subtitleAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 29, weight: .medium),
              .foregroundColor: NSColor.white.withAlphaComponent(0.82)
          ]
          ("Your private timeline for everything you do" as NSString)
              .draw(at: NSPoint(x: 235, y: 632), withAttributes: subtitleAttrs)

          let arrow = NSBezierPath()
          arrow.move(to: NSPoint(x: 495, y: 405))
          arrow.line(to: NSPoint(x: 705, y: 405))
          arrow.move(to: NSPoint(x: 655, y: 455))
          arrow.line(to: NSPoint(x: 705, y: 405))
          arrow.line(to: NSPoint(x: 655, y: 355))
          arrow.lineWidth = 12
          arrow.lineCapStyle = .round
          arrow.lineJoinStyle = .round
          let arrowShadow = NSShadow()
          arrowShadow.shadowColor = NSColor.systemBlue.withAlphaComponent(0.9)
          arrowShadow.shadowBlurRadius = 18
          arrowShadow.shadowOffset = .zero
          arrowShadow.set()
          NSColor.white.withAlphaComponent(0.95).setStroke()
          arrow.stroke()

          let instructionRect = NSRect(x: 260, y: 52, width: 680, height: 78)
          let bubble = NSBezierPath(roundedRect: instructionRect, xRadius: 39, yRadius: 39)
          NSColor(calibratedWhite: 0.03, alpha: 0.58).setFill()
          bubble.fill()
          NSColor(calibratedRed: 0.42, green: 0.50, blue: 1.0, alpha: 0.75).setStroke()
          bubble.lineWidth = 2
          bubble.stroke()

          let instructionAttrs: [NSAttributedString.Key: Any] = [
              .font: NSFont.systemFont(ofSize: 26, weight: .semibold),
              .foregroundColor: NSColor.white
          ]
          ("Drag Memory Trails to Applications to install" as NSString)
              .draw(at: NSPoint(x: 322, y: 78), withAttributes: instructionAttrs)

          image.unlockFocus()

          guard
              let tiff = image.tiffRepresentation,
              let bitmap = NSBitmapImageRep(data: tiff),
              let png = bitmap.representation(using: .png, properties: [:])
          else { exit(4) }
          try png.write(to: outputURL)
          SWIFT

          xcrun swift "$DRAW" "$MASTER" "$BG"
          test -s "$BG"

          hdiutil create             -volname "Memory Trails"             -srcfolder "$ROOT"             -ov             -format UDRW             "$RW_DMG"

          hdiutil attach -readwrite -noverify -noautoopen "$RW_DMG"
          MOUNT="/Volumes/Memory Trails"
          test -d "$MOUNT"

          osascript <<'APPLESCRIPT'
          tell application "Finder"
            tell disk "Memory Trails"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set pathbar visible of container window to false
              set bounds of container window to {100, 100, 1300, 900}
              set opts to icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 164
              set text size of opts to 13
              set background picture of opts to file ".background:installer.png"
              set position of item "Memory Trails.app" of container window to {360, 430}
              set position of item "Applications" of container window to {840, 430}
              close
              open
              update without registering applications
              delay 2
            end tell
          end tell
          APPLESCRIPT

          chflags hidden "$MOUNT/.background" || true
          sync
          hdiutil detach "$MOUNT"

          hdiutil convert "$RW_DMG"             -format UDZO             -imagekey zlib-level=9             -o "$DMG"

          rm -f "$RW_DMG"
          test -s "$DMG"
          shasum -a 256 "$DMG"

      - name: Publish single current GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          DMG="MemoryTrails-$RELEASE_VERSION.dmg"
          TITLE="Memory Trails $RELEASE_VERSION (Build $RELEASE_BUILD)"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"
          AUTH_HEADER="Authorization: Bearer $GH_TOKEN"
          ACCEPT_HEADER="Accept: application/vnd.github+json"
          VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

          cat > release-notes.md <<EOF
          Memory Trails $RELEASE_VERSION for macOS.
          Build: $RELEASE_BUILD

          Highlights:
          - Memory Trails 1.5 introduces the new illustrated Memory Trails installer experience.
          - The DMG now uses the current Memory Trails app icon, a branded mountain-and-trail background, a clear drag direction, and a polished Applications drop target.
          - Finder opens the installer at a purpose-built 1200 × 800 layout with the app and Applications icons positioned for a simple drag-and-drop install.
          - The existing Outlook capture, Today, Ask Memory Trails, Insights, Favorites, Clipboard History, local storage, export, update handling, and privacy-first behavior from 1.4 are retained.
          - Version 1.5 remains local-first: no cloud timeline sync, external data connectors, advertising SDKs, or AI timeline summarization.

          Privacy:
          - Captured activity is sourced, processed, and stored locally on the Mac.
          - No cloud timeline sync.
          - No external data connectors.
          - No analytics or advertising SDKs.
          - No Memory Trails account or remote account is required.
          - Captured timeline data is not transmitted to an external service.
          - Passwords and Wallet are excluded by default.
          - Clipboard capture can be disabled at any time.
          - Apps and processes can be excluded from capture.
          - Source code is available in this repository for review and verification.
          - Memory Trails does not generate AI summaries of the timeline.

          Requires macOS 14 or later. Detailed window/activity capture requires Accessibility permission.

          This automated build uses ad-hoc signing when a Developer ID certificate is not configured and is not notarized in that case.
          EOF

          BODY="$(cat release-notes.md)"
          TARGET_SHA="$(git rev-parse HEAD)"

          EXISTING_CODE="$(curl -sS -o existing-release.json -w '%{http_code}' \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/tags/$TAG")"

          if [ "$EXISTING_CODE" = "200" ]; then
            RELEASE_ID="$(jq -r '.id' existing-release.json)"
            jq -n \
              --arg target "$TARGET_SHA" \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              '{target_commitish:$target, name:$title, body:$body, draft:false, prerelease:false, make_latest:"true"}' \
              > release-payload.json

            curl -fsSL -X PATCH \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "$API/releases/$RELEASE_ID" \
              --data-binary @release-payload.json \
              > published-release.json
          else
            jq -n \
              --arg tag "$TAG" \
              --arg target "$TARGET_SHA" \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              '{tag_name:$tag, target_commitish:$target, name:$title, body:$body, draft:false, prerelease:false, make_latest:"true"}' \
              > release-payload.json

            curl -fsSL -X POST \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              -H "Content-Type: application/json" \
              "$API/releases" \
              --data-binary @release-payload.json \
              > published-release.json

            RELEASE_ID="$(jq -r '.id' published-release.json)"
          fi

          RELEASE_ID="${RELEASE_ID:-$(jq -r '.id' published-release.json)}"
          test -n "$RELEASE_ID"
          test "$RELEASE_ID" != "null"

          ASSET_ID="$(curl -fsSL \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/$RELEASE_ID/assets" \
            | jq -r --arg name "$DMG" '.[] | select(.name == $name) | .id' \
            | head -n 1)"

          if [ -n "$ASSET_ID" ]; then
            curl -fsSL -X DELETE \
              -H "$AUTH_HEADER" \
              -H "$ACCEPT_HEADER" \
              -H "$VERSION_HEADER" \
              "$API/releases/assets/$ASSET_ID" \
              >/dev/null
          fi

          # Remove the legacy pre-rename DMG so only MemoryTrails-$RELEASE_VERSION.dmg remains.
          LEGACY_DMG="MemoryTrail-$RELEASE_VERSION.dmg"
          curl -fsSL \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases/$RELEASE_ID/assets" \
            | jq -r --arg name "$LEGACY_DMG" '.[] | select(.name == $name) | .id' \
            | while read -r LEGACY_ASSET_ID; do
                [ -z "$LEGACY_ASSET_ID" ] && continue
                curl -fsSL -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  "$API/releases/assets/$LEGACY_ASSET_ID" \
                  >/dev/null
              done

          curl -fsSL -X POST \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            -H "Content-Type: application/x-apple-diskimage" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$DMG" \
            --data-binary @"$DMG" \
            > uploaded-asset.json

          test "$(jq -r '.state' uploaded-asset.json)" = "uploaded"
          echo "Published $(jq -r '.name' uploaded-asset.json) to $TAG."

          # Keep older test releases from blocking the official release.
          curl -fsSL \
            -H "$AUTH_HEADER" \
            -H "$ACCEPT_HEADER" \
            -H "$VERSION_HEADER" \
            "$API/releases?per_page=100" \
            > all-releases.json

          jq -r --arg tag "$TAG" '.[] | select(.tag_name != $tag) | [.id, .tag_name] | @tsv' all-releases.json \
            | while IFS=$'\t' read -r OLD_ID OLD_TAG; do
                [ -z "$OLD_ID" ] && continue
                curl -fsSL -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  "$API/releases/$OLD_ID" \
                  >/dev/null || true

                ENCODED_TAG="$(printf '%s' "$OLD_TAG" | jq -sRr @uri)"
                curl -fsSL -X DELETE \
                  -H "$AUTH_HEADER" \
                  -H "$ACCEPT_HEADER" \
                  -H "$VERSION_HEADER" \
                  "$API/git/refs/tags/$ENCODED_TAG" \
                  >/dev/null || true
              done
      - name: Publish refreshed app screenshots
        if: github.event_name == 'push' && steps.screenshots.outcome == 'success'
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$REMOTE_SHA" != "$LOCAL_SHA" ]; then
            echo "main advanced while this build was running; skipping screenshot commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
          else
            git commit -m "Refresh Memory Trails screenshots from real app UI"
            git push origin HEAD:main
          fi

