name: Build Memory Lane DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-lane-dmg.yml"
      - "Memory Lane.xcodeproj/**"
      - "MemoryLane/**"
      - "Scripts/**"

permissions:
  contents: write
  statuses: write
  pages: write
  id-token: write

jobs:
  build-dmg:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare app icon assets
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift "$PWD/Scripts/generate_app_icons.swift" "$PWD"

          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png"
          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/OnboardingIcon.imageset/OnboardingIcon.png"
          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/OnboardingIcon.imageset/OnboardingIcon@2x.png"

      - name: Build Memory Lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project "Memory Lane.xcodeproj" \
            -scheme "Memory Lane" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$PWD/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            ERROR_LINE="$(grep -m1 -E 'error:' "$PWD/xcodebuild.log" | sed 's/^[[:space:]]*//' | cut -c1-135 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Xcode build failed; inspect the workflow run."
            fi
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=memory-lane-build-diagnostics \
              -f description="$ERROR_LINE" >/dev/null
            exit "$BUILD_STATUS"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=memory-lane-build-diagnostics \
            -f description="Memory Lane Xcode build passed." >/dev/null

      - name: Render screenshots from the real app UI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          OUT="$PWD/docs/screenshots"
          LOG="$PWD/screenshot-export.log"

          test -x "$APP/Contents/MacOS/Memory Lane"
          mkdir -p "$OUT"
          rm -f "$OUT"/*.svg "$OUT"/*.png

          set +e
          "$APP/Contents/MacOS/Memory Lane" "--export-screenshots=$OUT" >"$LOG" 2>&1
          EXPORT_STATUS=$?
          set -e

          cat "$LOG" || true

          if [ "$EXPORT_STATUS" -ne 0 ]; then
            ERROR_LINE="$(tail -n 8 "$LOG" | tr '\n' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | cut -c1-135)"
            [ -n "$ERROR_LINE" ] || ERROR_LINE="Real-app screenshot exporter exited with status $EXPORT_STATUS."
            gh api               --method POST               "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"               -f state=failure               -f context=memory-lane-screenshot-diagnostics               -f description="$ERROR_LINE" >/dev/null
            exit "$EXPORT_STATUS"
          fi

          for FILE in timeline.png ask-memory-lane.png privacy-general.png; do
            if [ ! -s "$OUT/$FILE" ]; then
              ERROR_LINE="Expected real-app screenshot missing: $FILE"
              gh api                 --method POST                 "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"                 -f state=failure                 -f context=memory-lane-screenshot-diagnostics                 -f description="$ERROR_LINE" >/dev/null
              exit 1
            fi
            sips -g pixelWidth -g pixelHeight "$OUT/$FILE"
          done

          UNIQUE_SCREENSHOTS="$(shasum -a 256 "$OUT"/timeline.png "$OUT"/ask-memory-lane.png "$OUT"/privacy-general.png | awk '{print $1}' | sort -u | wc -l | tr -d ' ')"
          if [ "$UNIQUE_SCREENSHOTS" -ne 3 ]; then
            ERROR_LINE="Real-app screenshot export produced duplicate screens."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=failure -f context=memory-lane-screenshot-diagnostics -f description="$ERROR_LINE" >/dev/null
            exit 1
          fi

          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"             -f state=success             -f context=memory-lane-screenshot-diagnostics             -f description="Real Memory Lane UI screenshots rendered successfully." >/dev/null

      - name: Publish refreshed app screenshots
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          REMOTE_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "main advanced while this build was running; skipping screenshot commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots

          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi

          git commit -m "Refresh screenshots from real app UI"
          git push origin HEAD:main

      - name: Sign Memory Lane
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"

          if [ -n "${MACOS_CERTIFICATE_P12:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/memorylane-cert.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/memorylane-signing.keychain-db"
            echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
            test -n "$IDENTITY"
            codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          test -d "$APP"

          rm -rf "$PWD/dmg-root"
          mkdir -p "$PWD/dmg-root"
          ditto "$APP" "$PWD/dmg-root/Memory Lane.app"
          ln -s /Applications "$PWD/dmg-root/Applications"

          hdiutil create \
            -volname "Memory Lane" \
            -srcfolder "$PWD/dmg-root" \
            -ov \
            -format UDZO \
            "$PWD/MemoryLane-1.0.dmg"

          shasum -a 256 "$PWD/MemoryLane-1.0.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0"
          DMG="MemoryLane-1.0.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "Memory Lane 1.0" \
              --notes "Memory Lane 1.0 macOS DMG. This automated build uses ad-hoc signing and is not notarized."
          fi


  deploy-pages:
    if: github.event_name == 'push'
    needs: build-dmg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
