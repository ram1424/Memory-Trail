name: Build Memory Lane DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-lane-dmg.yml"
      - "Memory Lane.xcodeproj/**"
      - "MemoryLane/**"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare app icon assets
        run: |
          set -euo pipefail
          ICON_DIR="$PWD/MemoryLane/Resources/Assets.xcassets/AppIcon.appiconset"
          ONBOARDING_DIR="$PWD/MemoryLane/Resources/Assets.xcassets/OnboardingIcon.imageset"
          mkdir -p "$ICON_DIR" "$ONBOARDING_DIR"

          xcrun swift "$PWD/MemoryLane/Resources/GenerateMemoryLaneIcon.swift" "$PWD/memory-lane-icon-master.png"

          sips -z 16 16 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_16x16.png" >/dev/null
          sips -z 32 32 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_32x32.png" >/dev/null
          sips -z 64 64 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_128x128.png" >/dev/null
          sips -z 256 256 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_256x256.png" >/dev/null
          sips -z 512 512 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$PWD/memory-lane-icon-master.png" --out "$ICON_DIR/icon_512x512.png" >/dev/null
          cp "$PWD/memory-lane-icon-master.png" "$ICON_DIR/icon_512x512@2x.png"
          cp "$PWD/memory-lane-icon-master.png" "$ONBOARDING_DIR/OnboardingIcon.png"

      - name: Build Memory Lane
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Memory Lane.xcodeproj" \
            -scheme "Memory Lane" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Ad-hoc sign Memory Lane
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          test -d "$APP"

          rm -rf "$PWD/dmg-root"
          mkdir -p "$PWD/dmg-root"
          ditto "$APP" "$PWD/dmg-root/Memory Lane.app"
          ln -s /Applications "$PWD/dmg-root/Applications"

          hdiutil create \
            -volname "Memory Lane" \
            -srcfolder "$PWD/dmg-root" \
            -ov \
            -format UDZO \
            "$PWD/MemoryLane-1.0.0.dmg"

          shasum -a 256 "$PWD/MemoryLane-1.0.0.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          DMG="MemoryLane-1.0.0.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "Memory Lane 1.0.0" \
              --notes "Memory Lane 1.0.0 macOS DMG. This automated build uses ad-hoc signing and is not notarized."
          fi
