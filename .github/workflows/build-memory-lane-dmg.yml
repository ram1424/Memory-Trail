name: Build Memory Lane DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-lane-dmg.yml"
      - "Memory Lane.xcodeproj/**"
      - "MemoryLane/**"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare app icon assets
        run: |
          set -euo pipefail
          ICON_DIR="$PWD/MemoryLane/Resources/Assets.xcassets/AppIcon.appiconset"
          SWIFT_FILE="$PWD/MemoryLane/macOS/MemoryLaneApp.swift"
          mkdir -p "$ICON_DIR"

          python3 - "$SWIFT_FILE" "$PWD/memory-lane-icon-source.png" <<'PY'
          import base64
          import re
          import sys

          source = open(sys.argv[1], "r", encoding="utf-8").read()
          match = re.search(r'Data\(base64Encoded: "([A-Za-z0-9+/=]+)"\)', source)
          if not match:
              raise SystemExit("Unable to locate embedded Memory Lane icon data.")
          open(sys.argv[2], "wb").write(base64.b64decode(match.group(1)))
          PY

          sips -z 16 16 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_16x16.png" >/dev/null
          sips -z 32 32 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_32x32.png" >/dev/null
          sips -z 64 64 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_128x128.png" >/dev/null
          sips -z 256 256 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_256x256.png" >/dev/null
          sips -z 512 512 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_512x512.png" >/dev/null
          sips -z 1024 1024 "$PWD/memory-lane-icon-source.png" --out "$ICON_DIR/icon_512x512@2x.png" >/dev/null

      - name: Build Memory Lane
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Memory Lane.xcodeproj" \
            -scheme "Memory Lane" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::error::A stable Developer ID Application certificate is required for Memory Lane releases."
            echo "::error::Without it, macOS Accessibility permission can break between updates."
            exit 1
          fi

          CERT_PATH="$RUNNER_TEMP/memorylane-cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/memorylane-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign Memory Lane
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"

          IDENTITY="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY"

          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "Signing identity:"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E 'Authority=|TeamIdentifier=|Identifier='

          echo "Designated requirement:"
          codesign -d -r- "$APP" 2>&1

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          test -d "$APP"

          rm -rf "$PWD/dmg-root"
          mkdir -p "$PWD/dmg-root"
          ditto "$APP" "$PWD/dmg-root/Memory Lane.app"
          ln -s /Applications "$PWD/dmg-root/Applications"

          hdiutil create \
            -volname "Memory Lane" \
            -srcfolder "$PWD/dmg-root" \
            -ov \
            -format UDZO \
            "$PWD/MemoryLane-1.0.0.dmg"

          shasum -a 256 "$PWD/MemoryLane-1.0.0.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0"
          DMG="MemoryLane-1.0.0.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "Memory Lane 1.0.0" \
              --notes "Memory Lane 1.0.0 macOS DMG. Release builds require a stable Developer ID Application signature so macOS can preserve Accessibility trust across updates."
          fi
