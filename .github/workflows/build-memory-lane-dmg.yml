name: Build Memory Lane DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-memory-lane-dmg.yml"
      - "Memory Lane.xcodeproj/**"
      - "MemoryLane/**"
      - "Scripts/**"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare app icon assets
        run: |
          set -euo pipefail
          /usr/bin/xcrun swift "$PWD/Scripts/generate_app_icons.swift" "$PWD"

          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512@2x.png"
          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/OnboardingIcon.imageset/OnboardingIcon.png"
          test -f "$PWD/MemoryLane/Resources/Assets.xcassets/OnboardingIcon.imageset/OnboardingIcon@2x.png"

      - name: Build Memory Lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          set +e
          xcodebuild \
            -project "Memory Lane.xcodeproj" \
            -scheme "Memory Lane" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee "$PWD/xcodebuild.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            ERROR_LINE="$(grep -m1 -E 'error:' "$PWD/xcodebuild.log" | sed 's/^[[:space:]]*//' | cut -c1-135 || true)"
            if [ -z "$ERROR_LINE" ]; then
              ERROR_LINE="Xcode build failed; inspect the workflow run."
            fi
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context=memory-lane-build-diagnostics \
              -f description="$ERROR_LINE" >/dev/null
            exit "$BUILD_STATUS"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=memory-lane-build-diagnostics \
            -f description="Memory Lane Xcode build passed." >/dev/null

      - name: Ad-hoc sign Memory Lane
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release/Memory Lane.app"
          test -d "$APP"

          rm -rf "$PWD/dmg-root"
          mkdir -p "$PWD/dmg-root"
          ditto "$APP" "$PWD/dmg-root/Memory Lane.app"
          ln -s /Applications "$PWD/dmg-root/Applications"

          hdiutil create \
            -volname "Memory Lane" \
            -srcfolder "$PWD/dmg-root" \
            -ov \
            -format UDZO \
            "$PWD/MemoryLane-1.0.1.dmg"

          shasum -a 256 "$PWD/MemoryLane-1.0.1.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.1"
          DMG="MemoryLane-1.0.1.dmg"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            gh release create "$TAG" "$DMG" \
              --title "Memory Lane 1.0.1" \
              --notes "Memory Lane 1.0.1 macOS DMG. This automated build uses ad-hoc signing and is not notarized."
          fi
